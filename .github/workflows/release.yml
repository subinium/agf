name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  quality:
    name: Release quality
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write

  verify:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        run: |
          pkg_version=$(cargo pkgid | sed 's/.*[@#]//')
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "Cargo.toml version ($pkg_version) != tag ($tag_version)" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: [verify, quality]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: agf-aarch64-apple-darwin
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: agf-x86_64-apple-darwin
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: agf-x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: agf-aarch64-unknown-linux-gnu
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: agf-x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz agf
          cd ../../..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/agf.exe -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    name: Create Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          shopt -s nullglob
          files=(*/*.tar.gz */*.zip)
          # Keep in sync with the build matrix size.
          if [ "${#files[@]}" -ne 5 ]; then
            echo "expected 5 release archives, found ${#files[@]}: ${files[*]}" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            (cd "$(dirname "$f")" && sha256sum "$(basename "$f")") >> checksums.txt
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/checksums.txt

  publish:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish and verify the exact registry version
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is required for a complete release." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          if python3 scripts/verify_registry.py "$version" --exists-only; then
            echo "agf $version is already published; verifying provenance next"
          else
            status=$?
            if [ "$status" -ne 3 ]; then exit "$status"; fi
            cargo publish --locked
          fi
          python3 scripts/verify_registry.py "$version" --expect-commit "$(git rev-parse HEAD)"
      - name: Verify installed registry binary
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo install agf --version "=$version" --locked --root "$RUNNER_TEMP/agf-registry"
          "$RUNNER_TEMP/agf-registry/bin/agf" --version
          python3 scripts/smoke_binary.py "$RUNNER_TEMP/agf-registry/bin/agf" "$version"
