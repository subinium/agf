[package]
name = "agf"
version = "0.15.0"
edition = "2024"
# 1.88 = let-chains (edition 2024); also covers usize::is_multiple_of (1.87).
rust-version = "1.88"
description = "Find and resume local AI coding-agent sessions across Claude Code, Codex, Grok, Kimi, Qwen, Prime Agent, Gemini, Cursor CLI, OpenCode, Kiro, pi, Hermes, Oh My Pi, and Yolop"
license = "MIT"
repository = "https://github.com/subinium/agf"
keywords = ["tui", "cli", "agent", "session", "claude"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
superlighttui = "0.24.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 0.40's libsqlite3-sys currently uses std::cfg_select! (Rust 1.95) without
# declaring that MSRV. Keep the crate's tested Rust 1.88 floor honest.
rusqlite = { version = "=0.39.0", features = ["bundled"] }
nucleo = "0.5"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1.0.103"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
rayon = "1"
unicode-width = "0.2"
unicode-segmentation = "1.12"
toml = "1"
sha2 = "0.10"
rmcp = { version = "3.2.0", default-features = false, features = ["server", "macros", "transport-io"], optional = true }
tokio = { version = "1", features = ["rt", "io-std", "sync", "time"], optional = true }

[features]
default = ["mcp"]
mcp = ["dep:rmcp", "dep:tokio"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# No `panic = "abort"`: scanner::scan_all relies on unwinding to isolate a
# panicking scanner thread (join -> Err) so one malformed session file can't
# take down the whole listing.
