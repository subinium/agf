[package]
name = "agf"
version = "0.11.4"
edition = "2021"
# 1.88 = let-chains (edition 2024); also covers usize::is_multiple_of (1.87).
rust-version = "1.88"
description = "Find and resume local AI coding-agent sessions across Claude Code, Codex, Gemini, Cursor CLI, OpenCode, Kiro, pi, and Hermes"
license = "MIT"
repository = "https://github.com/subinium/agf"
keywords = ["tui", "cli", "agent", "session", "claude"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
superlighttui = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
nucleo = "0.5"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
rayon = "1"
unicode-width = "0.2"
toml = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
